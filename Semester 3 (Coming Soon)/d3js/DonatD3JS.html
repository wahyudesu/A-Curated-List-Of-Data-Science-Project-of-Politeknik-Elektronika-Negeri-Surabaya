<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut Chart menggunakan D3.js</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .label {
            font-size: 12px;
            font-weight: bold;
            fill: #333;
        }
    </style>
</head>
<body>

<h2>Contoh Donut Chart dengan D3.js</h2>
<svg width="600" height="500"></svg>

<script>
    // Data untuk donut chart
    const data = [
        {label: "A", value: 30},
        {label: "B", value: 70},
        {label: "C", value: 45},
        {label: "D", value: 65},
        {label: "E", value: 20},
        {label: "F", value: 85}
    ];

    // Ukuran dan radius
    const width = 600;
    const height = 500;
    const outerRadius = Math.min(width, height) / 2 - 50;
    const innerRadius = outerRadius / 2; // radius dalam untuk membuat efek donat

    // Skala warna untuk setiap bagian grafik
    const color = d3.scaleOrdinal()
                    .domain(data.map(d => d.label))
                    .range(d3.schemeCategory10);

    // SVG tempat menggambar grafik
    const svg = d3.select("svg")
                  .attr("width", width)
                  .attr("height", height)
                  .append("g")
                  .attr("transform", `translate(${width / 2},${height / 2})`);

    // Fungsi untuk layout pie
    const pie = d3.pie()
                  .value(d => d.value)
                  .sort(null);

    // Fungsi untuk mengatur bentuk slice dengan radius luar dan radius dalam
    const arc = d3.arc()
                  .innerRadius(innerRadius)
                  .outerRadius(outerRadius);

    // Menambahkan slice berdasarkan data
    svg.selectAll("path")
       .data(pie(data))
       .join("path")
       .attr("d", arc)
       .attr("fill", d => color(d.data.label))
       .attr("stroke", "white")
       .attr("stroke-width", 2);

    // Menambahkan label nilai di luar slice
    svg.selectAll("text")
       .data(pie(data))
       .join("text")
       .attr("transform", d => `translate(${arc.centroid(d)})`)
       .attr("dy", "0.35em")
       .attr("class", "label")
       .attr("text-anchor", "middle")
       .text(d => `${d.data.label}: ${d.data.value}`);
</script>

</body>
</html>
