<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard D3.js</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .bar {
            fill: green; /* Changed color of the bar chart */
        }

        .bar:hover {
            fill: yellow; /* Changed hover color */
        }

        .arc {
            fill: #ff5733; /* Changed color of the pie chart */
            stroke: #fff;
            stroke-width: 1px;
        }

        .line {
            fill: none;
            stroke: orange; /* Changed color of the line chart */
            stroke-width: 2px;
        }

        .dot {
            fill: blue; /* Changed color of the scatter plot dots */
        }

        .chart-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 50px; /* Spacing between rows */
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Grafik Batang dan Lingkaran</h2>
    <div class="chart-container">
        <svg id="barChart" width="400" height="300"></svg>
        <svg id="pieChart" width="300" height="300"></svg>
    </div>

    <h2>Grafik Garis dan Scatter Plot</h2>
    <div class="chart-container">
        <svg id="lineChart" width="400" height="300"></svg>
        <svg id="scatterPlot" width="300" height="300"></svg>
    </div>

    <script>
        // Data untuk grafik batang
        const barData = [5, 10, 20, 25, 30, 50]; // Changed data for bar chart

        const barSvg = d3.select("#barChart");
        const barMargin = { top: 20, right: 30, bottom: 40, left: 40 };
        const barWidth = +barSvg.attr("width") - barMargin.left - barMargin.right;
        const barHeight = +barSvg.attr("height") - barMargin.top - barMargin.bottom;

        const barX = d3.scaleBand()
            .domain(barData.map((d, i) => i))
            .range([0, barWidth])
            .padding(0.1);

        const barY = d3.scaleLinear()
            .domain([0, d3.max(barData)])
            .range([barHeight, 0]);

        const barG = barSvg.append("g")
            .attr("transform", `translate(${barMargin.left},${barMargin.top})`);

        barG.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", `translate(0,${barHeight})`)
            .call(d3.axisBottom(barX).tickFormat(i => `Data ${i + 1}`));

        barG.append("g")
            .attr("class", "axis axis--y")
            .call(d3.axisLeft(barY));

        barG.selectAll(".bar")
            .data(barData)
            .enter().append("rect")
            .attr("class", "bar")
            .attr("x", (d, i) => barX(i))
            .attr("y", d => barY(d))
            .attr("width", barX.bandwidth())
            .attr("height", d => barHeight - barY(d));

        // Data untuk grafik lingkaran
        const pieData = [
            { label: "A", value: 40 }, // Changed value
            { label: "B", value: 60 }, // Changed value
            { label: "C", value: 50 }, // Changed value
            { label: "D", value: 30 }, // Changed value
        ];

        const pieSvg = d3.select("#pieChart");
        const pieRadius = Math.min(+pieSvg.attr("width"), +pieSvg.attr("height")) / 2;
        const pieG = pieSvg.append("g")
            .attr("transform", `translate(${pieRadius}, ${pieRadius})`);

        const pie = d3.pie()
            .value(d => d.value);

        const arc = d3.arc()
            .innerRadius(0) // Grafik lingkaran penuh
            .outerRadius(pieRadius-10);

        const arcs = pie(pieData);

        pieG.selectAll(".arc")
            .data(arcs)
            .enter().append("path")
            .attr("class", "arc")
            .attr("d", arc)
            .style("fill", (d, i) => d3.schemeCategory10[i]);

        // Menambahkan legend untuk grafik lingkaran
        pieG.selectAll(".legend")
            .data(pieData)
            .enter().append("text")
            .attr("x", (d, i) => (i % 2) * (pieRadius - 30) + 10)
            .attr("y", (d, i) => Math.floor(i / 2) * 20)
            .text(d => `${d.label}: ${d.value}`);

        // Data untuk grafik garis
        const lineData = [
            { x: 1, y: 5 }, // Changed data
            { x: 2, y: 12 }, // Changed data
            { x: 3, y: 18 }, // Changed data
            { x: 4, y: 22 }, // Changed data
            { x: 5, y: 28 }, // Changed data
            { x: 6, y: 45 }  // Changed data
        ];

        const lineSvg = d3.select("#lineChart");
        const lineMargin = { top: 20, right: 30, bottom: 40, left: 40 };
        const lineWidth = +lineSvg.attr("width") - lineMargin.left - lineMargin.right;
        const lineHeight = +lineSvg.attr("height") - lineMargin.top - lineMargin.bottom;

        const lineX = d3.scaleLinear()
            .domain(d3.extent(lineData, d => d.x))
            .range([0, lineWidth]);

        const lineY = d3.scaleLinear()
            .domain([0, d3.max(lineData, d => d.y)])
            .range([lineHeight, 0]);

        const lineG = lineSvg.append("g")
            .attr("transform", `translate(${lineMargin.left},${lineMargin.top})`);

        const line = d3.line()
            .x(d => lineX(d.x))
            .y(d => lineY(d.y));

        lineG.append("path")
            .datum(lineData)
            .attr("class", "line")
            .attr("d", line);

        lineG.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", `translate(0,${lineHeight})`)
            .call(d3.axisBottom(lineX));

        lineG.append("g")
            .attr("class", "axis axis--y")
            .call(d3.axisLeft(lineY));

        // Data untuk scatter plot
        const scatterData = [
            { x: 20, y: 30 }, // Changed coordinates
            { x: 40, y: 50 }, // Changed coordinates
            { x: 70, y: 90 }, // Changed coordinates
            { x: 80, y: 70 }, // Changed coordinates
            { x: 100, y: 120 }, // Changed coordinates
            { x: 120, y: 90 } // Changed coordinates
        ];

        const scatterSvg = d3.select("#scatterPlot");
        const scatterMargin = { top: 20, right: 30, bottom: 40, left: 40 };
        const scatterWidth = +scatterSvg.attr("width") - scatterMargin.left - scatterMargin.right;
        const scatterHeight = +scatterSvg.attr("height") - scatterMargin.top - scatterMargin.bottom;

        const scatterX = d3.scaleLinear()
            .domain([0, d3.max(scatterData, d => d.x)])
            .range([0, scatterWidth]);

        const scatterY = d3.scaleLinear()
            .domain([0, d3.max(scatterData, d => d.y)])
            .range([scatterHeight, 0]);

        const scatterG = scatterSvg.append("g")
            .attr("transform", `translate(${scatterMargin.left},${scatterMargin.top})`);

        scatterG.selectAll(".dot")
            .data(scatterData)
            .enter().append("circle")
            .attr("class", "dot")
            .attr("cx", d => scatterX(d.x))
            .attr("cy", d => scatterY(d.y))
            .attr("r", 5);

        scatterG.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", `translate(0,${scatterHeight})`)
            .call(d3.axisBottom(scatterX));

        scatterG.append("g")
            .attr("class", "axis axis--y")
            .call(d3.axisLeft(scatterY));
    </script>
</body>
</html>
