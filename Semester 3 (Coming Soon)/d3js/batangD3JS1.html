<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart dengan D3.js</title>
    <script src="d3.min.js"></script>
    <style>
        .bar {
            fill: steelblue;
        }

        .bar:hover {
            fill: orange;
        }

        .axis-label {
            font-size: 12px;
        }
    </style>
</head>
<body>

<h2>Contoh Grafik Batang dengan D3.js</h2>
<svg width="600" height="400"></svg>

<script>
    // Data yang akan digunakan
    const data = [30, 80, 45, 60, 20, 90, 50];

    // Ukuran dan margin grafik
    const width = 600;
    const height = 400;
    const margin = { top: 20, right: 30, bottom: 40, left: 40 };

    // Skala untuk sumbu X dan Y
    const x = d3.scaleBand()
                .domain(data.map((d, i) => i))
                .range([margin.left, width - margin.right])
                .padding(0.1);

    const y = d3.scaleLinear()
                .domain([0, d3.max(data)])
                .nice()
                .range([height - margin.bottom, margin.top]);

    // SVG tempat menggambar grafik
    const svg = d3.select("svg");

    // Menambahkan elemen batang
    svg.selectAll(".bar")
        .data(data)
        .join("rect")
        .attr("class", "bar")
        .attr("x", (d, i) => x(i))
        .attr("y", d => y(d))
        .attr("height", d => y(0) - y(d))
        .attr("width", x.bandwidth());

    // Menambahkan sumbu X
    svg.append("g")
        .attr("transform", `translate(0,${height - margin.bottom})`)
        .call(d3.axisBottom(x).tickFormat(i => `Item ${i+1}`))
        .attr("font-size", "12px");

    // Menambahkan sumbu Y
    svg.append("g")
        .attr("transform", `translate(${margin.left},0)`)
        .call(d3.axisLeft(y))
        .attr("font-size", "12px");

    // Menambahkan label untuk sumbu
    svg.append("text")
        .attr("x", width / 2)
        .attr("y", height - 5)
        .attr("text-anchor", "middle")
        .attr("class", "axis-label")
        .text("Item");

    svg.append("text")
        .attr("x", -height / 2)
        .attr("y", 15)
        .attr("transform", "rotate(-90)")
        .attr("text-anchor", "middle")
        .attr("class", "axis-label")
        .text("Value");
</script>

</body>
</html>
